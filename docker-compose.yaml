services:
  db: 
    image: postgres:16.4
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    secrets:
      - postgres_pw
      - encryption_key
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_pw
      SESSION_KEY_FILE: /run/secrets/encryption_key
      POSTGRES_USER: user
      POSTGRES_DB: webdrones
      DB_HOSTNAME: db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d webdrones"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:5432:5432"

  server:
    depends_on:
      - db
    build: 
      context: ./
      platforms: 
        - linux/arm/v7
        - linux/amd64
      # Why do i need this tag and the image name below??
      tags: 
        - ghcr.io/ryan-michael-19/web-drones:latest
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_pw
      SESSION_KEY_FILE: /run/secrets/encryption_key
      POSTGRES_USER: user
      POSTGRES_DB: webdrones
      DB_HOSTNAME: db
    secrets:
      - postgres_pw
      - encryption_key
    image: ghcr.io/ryan-michael-19/web-drones:latest
    # Even though we have db set as a dependency this service comes up
    # before the database is ready. Ugh
    restart: always 
    ports:
      - "8080:8080"
    volumes:
      - ./container-logs:/app/logs
    profiles:
      - dev
      - prod

  nginx:
    depends_on:
      - server
    image: nginx:1.27
    restart: always
    volumes:
      - ./prod-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./base.nginx.conf:/etc/nginx/base.nginx.conf:ro
      - ./static:/www:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/nginx:/etc/nginx/tls:ro
      - ./nginx-ssl.conf:/etc/nginx/tls-template/webdrones.conf:ro
    ports:
      - "443:443"
      - "80:80"
    profiles:
      - prod

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    depends_on:
      - nginx
    # Share nginx's PID namespace so Certbot can signal its master process to reload.
    pid: "service:nginx"
    entrypoint: /bin/sh
    command: /scripts/certbot-renew.sh
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/nginx:/etc/nginx/tls
      - ./nginx-ssl.conf:/etc/nginx/tls-template/webdrones.conf:ro
      - ./scripts/certbot-renew.sh:/scripts/certbot-renew.sh:ro
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    profiles:
      - prod

  nginx_dev:
    # depends_on:
      # - server
    image: nginx:latest
    restart: always
    volumes:
     - ./dev-nginx.conf:/etc/nginx/nginx.conf:ro
     - ./base.nginx.conf:/etc/nginx/base.nginx.conf:ro
     - ./static:/www
    ports:
      - "80:80"
    # host mode can be enabled if you need to connect to the server
    # outside of a container (useful for debugging)
    # TODO: configure this without needing to uncomment code
    # network_mode: host
    profiles:
      - dev
      - debug

  init_db:
    depends_on:
      db:
        condition: service_healthy
    image: ghcr.io/ryan-michael-19/web-drones:latest
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_pw
      SESSION_KEY_FILE: /run/secrets/encryption_key
      POSTGRES_USER: user
      POSTGRES_DB: webdrones
      DB_HOSTNAME: db
    secrets:
      - postgres_pw
      - encryption_key
    command:
      - /app/web-drones
      - SCHEMA
    profiles:
      - init
  
  # Using https://hub.docker.com/r/prom/node-exporter setup to monitor host
  # and not container
  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    command:
      - '--path.rootfs=/host'
    # network_mode: host
    pid: host
    restart: always 
    volumes:
      - '/:/host:ro,rslave'
    profiles:
      # node_exporter can't run on wsl
      - prod

secrets:
  postgres_pw:
    file: ./postgres_pw.txt
  encryption_key:
    file: ./encryption_key.txt


networks:
  dev_host:
    driver: host
