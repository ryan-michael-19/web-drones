# TODO: Lint this file it is absolutely hideous
events {}
http {
    server {
        include  /etc/nginx/mime.types;
        include  /etc/nginx/base.nginx.conf;
        listen 80;
        server_name webdrones.net;
        # HTTP-01 validation: Certbot writes each temporary token under this webroot.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }
    # This directory starts with a comment-only file and gains the HTTPS server
    # after Certbot has issued the first certificate.
    include /etc/nginx/tls/*.conf;
}
